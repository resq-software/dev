#
# Run the bats suite over the canonical git hooks. The hook templates live
# in resq-software/crates; the suite fetches them at bats init time — from the
# commit scripts/install-hooks.sh pins, so it tests what users are installed —
# and tests behavior (here-string safety, local-* dispatch, stdin propagation,
# GIT_HOOKS_SKIP, etc).

name: hooks-tests

on:
  push:
    branches: [main]
    paths:
      - 'tests/hooks/**'
      - 'scripts/install-hooks.sh'
      - '.github/workflows/hooks-tests.yml'
  pull_request:
    paths:
      - 'tests/hooks/**'
      - 'scripts/install-hooks.sh'
      - '.github/workflows/hooks-tests.yml'
  # Weekly — catches canonical-template drift on the crates side that
  # breaks bats assertions, without requiring a dev-side change to fire.
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bats:
    name: bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bats
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bats

      - name: Run hook test suite
        run: bats tests/hooks/

      - name: Print bats version (diagnostic)
        if: always()
        run: bats --version

  # The job above tests the crates commit install-hooks.sh pins — what users
  # actually get. This one tests crates master, so a template change that will
  # break the suite shows up before the next pin bump rather than during it.
  # Schedule/dispatch only: upstream drift is not something a dev PR can fix.
  bats-upstream:
    name: bats (crates master)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bats
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bats

      - name: Run hook test suite against crates master
        env:
          RESQ_HOOK_REF: master
        run: bats tests/hooks/
