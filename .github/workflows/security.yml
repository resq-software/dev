#
# Thin caller for the org-wide reusable security-scan workflow in
# resq-software/.github. Update the `languages` list to match this repo's
# primary code; everything else inherits.

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  # `actions: read` is required by the reusable workflow's CodeQL + SARIF-upload
  # jobs (they declare it for github/codeql-action telemetry). An explicit
  # permissions block sets every unlisted scope to `none`, so without this the
  # nested jobs request more than the caller grants and the run is rejected at
  # creation (startup_failure). Read-only; grants no write capability.
  actions: read
  contents: read
  security-events: write
  pull-requests: read

jobs:
  scan:
    # Skip on Dependabot PRs: a cross-repo reusable workflow called with `secrets: inherit`
    # startup-fails for Dependabot's restricted context, which blocks Dependabot's own security
    # PRs. Dependabot already vetted the bump; push/schedule still scan the default branch.
    if: ${{ github.actor != 'dependabot[bot]' }}
    uses: resq-software/.github/.github/workflows/security-scan.yml@44987ffd6eb5b1aa9d0a0d39e8dde9d669fe1d84 # main
    with:
      languages: '["actions"]'
      enable-semgrep: true
    # Forward only the named secrets the reusable workflow declares, instead
    # of `secrets: inherit` (which hands it ALL of this repo's secrets and
    # trips zizmor's `secrets-inherit` audit).
    secrets:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
