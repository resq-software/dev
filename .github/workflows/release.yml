#
# VERSION merged to main -> verify -> tag -> publish -> propose the pin bump.
#
# WHY THIS RUNS ON A VERSION CHANGE, NOT ON A TAG
#
# Earlier this was tag-triggered, on the reasoning that creating a tag was the
# deliberate human act. That stopped being true once Cloudflare Workers Builds
# began deploying worker/ straight from main: the act deciding what users
# receive is now merging a reviewed change to VERSION and PINS, both
# CODEOWNERS-gated. Tagging afterwards added no judgement, only a step that
# could be forgotten — leaving VERSION bumped, installers stamped, and no
# release to match.
#
# Automating a tag *push* does not work, for two reasons worth recording so
# nobody re-derives them the hard way:
#
#   1. The `release-tags` ruleset blocks creation of refs/tags/v* for everyone
#      outside @resq-software/installer-maintainers, so a bot push is rejected
#      unless the GitHub Actions app is a bypass actor.
#   2. Even when allowed, a tag pushed with GITHUB_TOKEN does not start a
#      workflow run. GitHub suppresses run-triggering events from that token —
#      the same rule that would have left every pin-bump PR without its
#      required check.
#
# So the trigger is inverted instead: this runs because VERSION changed, and
# creates the tag as an *output* of its own work. Nothing needs to be triggered
# by the tag, so (2) cannot apply. Only (1) remains, and it is a one-time
# ruleset change.
#
# NO CLOUDFLARE CREDENTIALS LIVE HERE. Deployment is Workers Builds pulling from
# this repository; GitHub never holds a key that can touch the account.
#
# actions/checkout is the only third-party action, at the SHA already trusted
# elsewhere in this repo.

name: release

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
  # For re-running a release whose later stages failed. Tag creation below is
  # idempotent, so a re-run against an already-tagged VERSION is safe.
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a release mid-flight.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: verify and tag
    runs-on: ubuntu-latest
    permissions:
      # Creating refs/tags/v* — the only write this job performs.
      contents: write
    outputs:
      pins: ${{ steps.pins.outputs.json }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gen-pins.sh derives the pin set from every v* tag, so shallow
          # history would silently drop older releases and 404 their URLs.
          fetch-depth: 0
          # The tag is created through the API with GH_TOKEN, not pushed from
          # this clone, so the token never needs to sit in .git/config.
          persist-credentials: false

      - name: Read and validate VERSION
        id: meta
        run: |
          set -euo pipefail
          version="$(tr -d ' \t\r\n' < VERSION)"

          # The same shape rule bin/stamp.sh enforces, checked again because
          # this value becomes a git ref and a URL path segment.
          case "$version" in
            ''|*[!0-9.]*|.*|*.|*..*)
              echo "::error::VERSION must look like MAJOR.MINOR.PATCH, got '$version'"; exit 1 ;;
          esac
          dots="$(printf '%s' "$version" | tr -cd '.' | wc -c | tr -d ' ')"
          [ "$dots" = "2" ] || { echo "::error::VERSION must have three components, got '$version'"; exit 1; }

          {
            echo "version=$version"
            echo "tag=v$version"
          } >> "$GITHUB_OUTPUT"
          echo "releasing v$version from $GITHUB_SHA"

      - name: Restrict where a release may be cut from
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        # workflow_dispatch lets a caller choose any ref. Without this, anyone
        # with write access could push a branch carrying a bumped VERSION and an
        # altered install.sh, dispatch a release, and obtain a tag plus a
        # published Release with SHA256SUMS — from code that was never reviewed.
        # That is exactly the gate this workflow exists to enforce, so the
        # dispatch path has to be pinned to refs a caller cannot forge.
        #
        # The push trigger only ever fires on main, so this guards dispatch.
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/main)
              echo "releasing from main"
              ;;
            "refs/tags/$TAG")
              # Recovery only: re-running a release whose later stages failed,
              # from the tag it already created. The tag step below then finds
              # that tag pointing at this very commit and continues, so this
              # path cannot publish anything new. Tag creation is itself
              # restricted by the release-tags ruleset, so the ref is already
              # privileged.
              echo "re-running the release for $TAG from its own tag"
              ;;
            *)
              echo "::error::releases may only be cut from refs/heads/main or refs/tags/$TAG, not $GITHUB_REF"
              exit 1
              ;;
          esac

      - name: Assert the installers are stamped
        # Verification by regeneration: re-run the stamper and fail if anything
        # would change. Comparing individual strings would silently miss any new
        # stamped value someone adds later; this cannot. Runs before the tag is
        # created, so a commit that fails it never gets one.
        run: sh bin/stamp.sh --check

      - name: Create the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        # Idempotent on purpose. A re-run, or a maintainer who tagged by hand
        # before merging, must not fail the release. But a tag already pointing
        # somewhere else means this VERSION was reused for a different commit,
        # which would republish different installers under a version people have
        # already pinned. That is worth stopping for.
        run: |
          set -euo pipefail

          # Branch on the exit status, not on captured output. `gh api` writes
          # its error body to *stdout* on a 404, so capturing stdout
          # unconditionally sets `existing` to a JSON error object — non-empty,
          # so the "already exists" branch fires and every first release fails
          # claiming a collision with a tag that does not exist. That is exactly
          # what happened on the first real dispatch.
          existing=""
          if ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>/dev/null)"; then
            existing="$(printf '%s' "$ref_json" | jq -r '.object.sha // empty')"

            # An annotated tag's ref points at a tag object rather than a
            # commit, so comparing that id against GITHUB_SHA would always
            # differ and read as a collision. Dereference to the commit it
            # targets. Tags this workflow creates are lightweight, but a
            # maintainer tagging by hand usually produces an annotated one.
            if [ "$(printf '%s' "$ref_json" | jq -r '.object.type // empty')" = "tag" ] && [ -n "$existing" ]; then
              existing="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$existing" --jq '.object.sha')"
            fi
          fi

          if [ -z "$existing" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
            echo "created $TAG at $GITHUB_SHA"
          elif [ "$existing" = "$GITHUB_SHA" ]; then
            echo "$TAG already exists at this commit; continuing"
          else
            echo "::error::$TAG already exists at $existing but this commit is $GITHUB_SHA."
            echo "::error::Bump VERSION rather than reusing a released version."
            exit 1
          fi

          # gen-pins.sh reads tags from the local clone, so make the new tag
          # visible here. Created locally rather than re-fetched: the API call
          # above already succeeded, so this avoids depending on a fetch too.
          git tag -f "$TAG" "$GITHUB_SHA"

      - name: Compute pins from tag history
        id: pins
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          json="$(sh bin/gen-pins.sh --compact)"

          # If this fires, the tag exists but produced no artifacts, and
          # publishing would advertise a version whose URLs 404.
          if ! printf '%s' "$json" | jq -e --arg v "$VERSION" '.releases[$v]' >/dev/null; then
            echo "::error::$TAG produced no pin entry for version $VERSION"
            exit 1
          fi

          latest="$(printf '%s' "$json" | jq -r '.latest')"
          if [ "$latest" != "$VERSION" ]; then
            echo "::warning::$VERSION is not the latest release ($latest); / will continue to serve $latest"
          fi

          echo "json=$json" >> "$GITHUB_OUTPUT"

      - name: Assert GitHub serves exactly these bytes
        # Without this, a mismatch would only surface for users, whose shells
        # would get a 502 from a Worker correctly refusing to serve.
        run: sh bin/gen-pins.sh --check

      - name: Worker test suite
        run: |
          set -euo pipefail
          node --version
          node worker/test/index.test.mjs

  release:
    name: publish release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Via env rather than inline `${{ }}` in the script body, so the value can
      # never be parsed as shell.
      PINS: ${{ needs.verify.outputs.pins }}
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - name: Rebuild SHA256SUMS from the pin set
        run: |
          set -euo pipefail
          printf '%s' "$PINS" \
            | jq -r --arg v "$VERSION" \
                '.releases[$v].artifacts | to_entries[] | "\(.value)  \(.key)"' \
            | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Idempotent alongside the tag step: a re-run must not fail because
          # the release already exists.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; refreshing SHA256SUMS only"
            gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi

          {
            echo "Installer artifacts pinned at \`$GITHUB_SHA\`."
            echo
            echo '```sh'
            echo "curl -fsSL https://get.resq.software | sh"
            echo "curl -fsSL https://get.resq.software/v$VERSION/install.sh | sh   # this release, forever"
            echo '```'
            echo
            echo "Verify what you were served, from one immutable release:"
            echo
            echo '```sh'
            # Full URLs rather than a REL= variable. A literal $REL inside
            # single quotes trips shellcheck SC2016, which actionlint fails the
            # build on; escaping it would read worse than just expanding
            # $VERSION here, and the reader gets lines they can paste without
            # setting a variable first.
            echo "curl -fsSL https://get.resq.software/v$VERSION/SHA256SUMS"
            echo "curl -fsSL https://get.resq.software/v$VERSION/install.sh | sha256sum"
            echo '```'
            echo
            echo "The endpoint keeps serving the previous release until the pin-bump PR merges and deploys."
            echo
            echo '### SHA256SUMS'
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > NOTES.md
          gh release create "$TAG" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file NOTES.md

  bump:
    name: propose pin bump
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required to dispatch required.yml after the push. See that step for why
      # a dispatch is the only mechanism that actually works.
      actions: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      # The one checkout in this repo that legitimately keeps the token: this
      # job pushes the bump branch. Every other checkout sets
      # persist-credentials: false.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Regenerate PINS
        id: bump
        run: |
          set -euo pipefail
          # The tag was created by the verify job, after this checkout's view of
          # the repository was taken, so fetch it before deriving pins.
          git fetch --tags --force origin
          sh bin/gen-pins.sh --write
          if git diff --quiet -- worker/src/index.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "PINS already current; nothing to propose."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff -- worker/src/index.js
          fi

      - name: Open pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="release/pins-v$VERSION"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add worker/src/index.js
          git commit -m "chore(worker): pin get.resq.software to v$VERSION"

          # --force-with-lease compares against the remote-tracking ref, which
          # does not exist here unless we fetch it first: `ref: main` above only
          # brought down main. Without this the lease has nothing to check and
          # the push is rejected on any re-run of a release.
          git fetch origin "$branch" || echo "no existing $branch on origin"
          git push --force-with-lease origin "$branch"

          if gh pr view "$branch" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "PR for $branch already open; updated in place"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "chore(worker): pin get.resq.software to v$VERSION" \
              --body "Regenerated by \`bin/gen-pins.sh --write\` from tag \`v$VERSION\`.

          Merging this is what changes the bytes \`curl -fsSL https://get.resq.software | sh\` serves. Cloudflare Workers Builds deploys on merge, and \`worker-live\` then verifies the endpoint agrees with main.

          Digests were already verified against raw.githubusercontent.com in the \`verify\` job of this release, and \`SHA256SUMS\` is published on the [release](../../releases/tag/v$VERSION). Review the diff below against it."
          fi

      - name: Dispatch the required checks for the bump branch
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Neither the PR nor the push above starts a workflow run: GitHub
        # suppresses run-triggering events originating from GITHUB_TOKEN, and
        # that applies to push just as much as to pull_request. An earlier
        # version relied on a push trigger for release/pins-*, which would have
        # left every bump PR permanently missing its `required` check and so
        # unmergeable.
        #
        # workflow_dispatch and repository_dispatch are the documented
        # exceptions, so we ask for the run explicitly. Check runs attach to the
        # branch head SHA, which is the PR's head, so the PR sees the result.
        # This keeps the whole flow free of a PAT or GitHub App secret.
        run: |
          set -euo pipefail
          branch="release/pins-v$VERSION"
          gh workflow run required.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          echo "dispatched required.yml against $branch"
