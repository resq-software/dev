# SPDX-License-Identifier: Apache-2.0
#
# Assert that what get.resq.software actually serves matches what `main` says.
#
# release.yml verifies digests before publishing. Nothing verified them
# afterwards, so every failure mode past that point was invisible: a Workers
# Builds deploy that silently did not run, a deploy of the wrong directory, a
# pin bump merged but never shipped, or an endpoint quietly failing closed
# because its pins went stale.
#
# The invariant is deliberately end-to-end and cheap to state:
#
#   the bytes on the wire hash to the digest the deployed Worker advertises,
#   and that digest is the one `main` currently declares.
#
# Both halves matter. The first catches a Worker serving corrupted or
# substituted content; the second catches a Worker that is honest but stale.
#
# Runs on push to main (Workers Builds deploys from there, so this is the
# confirmation) and daily — the endpoint can rot with no commit involved, for
# instance if GitHub stops serving a pinned commit.

name: worker-live

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker-live.yml'
  schedule:
    # Daily 06:41 UTC, off the hour to avoid the scheduling stampede.
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-live
  cancel-in-progress: false

jobs:
  live:
    name: live endpoint matches main
    runs-on: ubuntu-latest
    # Backstop only. The script enforces its own DEADLINE_MS (20 minutes) and
    # prints a diagnosis when it expires; this must stay comfortably above that
    # or the job is killed first and that diagnosis is lost. It exists so a
    # script that misbehaves cannot inherit GitHub's 6-hour default and burn
    # runner time on a stuck check.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read-only job; matches every other workflow in this repo.
          persist-credentials: false

      # Pinned because the step below imports worker/src/index.ts and depends on
      # native type stripping (Node 23.6+). This monitor is what caught both
      # production outages, so it must not be the thing that silently stops
      # working when the runner image changes underneath it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          # v7 enables npm caching by default via package-manager-cache. This
          # job installs nothing, so the cache buys nothing — and a monitor
          # that verifies live bytes should not be reading from a shared,
          # writable cache at all. See required.yml for the same reasoning.
          package-manager-cache: false

      - name: Compare the live endpoint against this commit
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          const ORIGIN = "https://get.resq.software";

          // Run main's Worker in-process to learn what it *would* serve. This
          // beats parsing the PINS block out of the source: the module itself
          // decides, so the check cannot drift from the implementation.
          globalThis.caches = { default: { match: async () => undefined, put: async () => {} } };
          const worker = (await import("./worker/src/index.ts")).default;
          const ctx = { waitUntil: (p) => p.catch(() => {}) };
          const localRes = await worker.fetch(new Request(`${ORIGIN}/manifest.json`), {}, ctx);
          const local = JSON.parse(await localRes.text());

          const want = local.artifacts["install.sh"].sha256;
          console.log(`main declares v${local.version} @ ${local.commit.slice(0, 8)} (install.sh ${want.slice(0, 12)})`);

          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const sha256 = async (buf) => {
            const d = await crypto.subtle.digest("SHA-256", buf);
            return [...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, "0")).join("");
          };

          // A push to main starts a Workers Builds deploy that finishes on its
          // own schedule, so converge rather than sampling once. When PINS did
          // not change, the first attempt already matches and this exits at once.
          //
          // 8 minutes, not the 3 this started with. A real deploy overran the
          // shorter window and the check reported "the deploy did not land"
          // while the deploy was simply still running; re-running it unchanged
          // passed. A check that cries wolf gets ignored exactly when it is
          // telling the truth, and this one had just caught two genuine
          // outages. Better to wait longer than to spend that credibility.
          // Enforced as an absolute wall-clock deadline, not a count of sleeps.
          // Counting attempts only bounds the time spent *sleeping*: fetch has
          // no default timeout in Node, so one hung connection would stall the
          // loop indefinitely and "8 minutes" would be a claim rather than a
          // limit. Each request gets its own timeout, and the loop never sleeps
          // past the deadline or after its final attempt.
          // Two numbers, because one was doing two jobs badly. DEADLINE_MS
          // decides when to declare failure; SLOW_MS decides when a deploy is
          // taking longer than expected. Conflating them tuned the window to a
          // single observed deploy: too short and a normal-but-slow deploy
          // fails the check, too long and a genuinely stuck one goes unnoticed.
          //
          // Now the deadline is generous and a late-but-successful deploy still
          // passes, emitting a notice. Slowdowns show up as a trend before they
          // become a false alarm.
          //
          // Keep DEADLINE_MS below the job's timeout-minutes, or the job is
          // killed first and the useful diagnosis below never prints.
          const DEADLINE_MS = 20 * 60 * 1000;
          const SLOW_MS = 8 * 60 * 1000;
          const POLL_MS = 15_000;
          const REQUEST_TIMEOUT_MS = 10_000;
          const startedAt = Date.now();
          const remaining = () => DEADLINE_MS - (Date.now() - startedAt);

          let live = null;
          let attempt = 0;
          while (remaining() > 0) {
            attempt++;
            try {
              const r = await fetch(`${ORIGIN}/manifest.json`, {
                cache: "no-store",
                signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS),
              });
              if (r.ok) {
                live = await r.json();
                if (live.commit === local.commit && live.version === local.version) break;
                console.log(`attempt ${attempt}: live v${live.version} @ ${String(live.commit).slice(0, 8)}, waiting for v${local.version} @ ${local.commit.slice(0, 8)}`);
              } else {
                console.log(`attempt ${attempt}: manifest HTTP ${r.status}`);
              }
            } catch (e) {
              console.log(`attempt ${attempt}: ${e.message}`);
            }
            const left = remaining();
            if (left <= 0) break;
            await sleep(Math.min(POLL_MS, left));
          }

          const elapsedS = () => Math.round((Date.now() - startedAt) / 1000);
          const converged = !!live && live.commit === local.commit && live.version === local.version;
          const fail = (msg) => { console.log(`::error::${msg}`); process.exit(1); };

          // A deploy that arrives late but correct is not a failure — but it is
          // worth surfacing, so a gradual slowdown is noticed as a trend rather
          // than discovered as a red check one day.
          if (converged && Date.now() - startedAt > SLOW_MS) {
            console.log(`::notice::deploy took ${elapsedS()}s to appear, beyond the ${SLOW_MS / 60000}-minute expectation. Raise SLOW_MS if this becomes normal.`);
          }

          if (!live) {
            fail(`no manifest could be read from ${ORIGIN} in ${elapsedS()}s across ${attempt} attempts — the Worker itself looks unreachable, which is a different problem from a stale deploy`);
          }
          if (!converged) {
            // Deliberately worded as timing rather than corruption. The digests
            // below are what detect a wrong deploy; this only detects one that
            // has not happened yet, and reading it as "the endpoint is serving
            // the wrong thing" sends people to the wrong place.
            fail(`after ${elapsedS()}s the live endpoint still serves v${live.version} @ ${String(live.commit).slice(0, 8)} while main declares v${local.version} @ ${local.commit.slice(0, 8)}. Nothing here says the served content is wrong — it says the deploy has not landed. Check Workers Builds first; re-run this if the build was simply slow.`);
          }

          // HEAD must still report a usable content-length, checked against the
          // real runtime rather than the Node harness. src/index.ts sets this
          // header on HEAD only, reasoning that GET framing belongs to the
          // platform — but workerd derives framing from the body, and a null
          // body could plausibly yield content-length: 0 and overwrite what we
          // set. That would make the comment in the source a lie, and the unit
          // tests cannot notice, because they never run inside workerd.
          {
            const headRes = await fetch(`${ORIGIN}/install.sh`, {
              method: "HEAD",
              cache: "no-store",
              signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS),
            });
            // Status first, or the diagnosis lies. A 502 carries no
            // content-length, so without this the check below reports a missing
            // header and sends whoever reads it hunting for a header bug, when
            // the endpoint is in fact refusing to serve.
            if (!headRes.ok) fail(`HEAD /install.sh returned HTTP ${headRes.status}`);
            const declared = Number(headRes.headers.get("content-length"));
            const bodyRes = await fetch(`${ORIGIN}/install.sh`, {
              cache: "no-store",
              signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS),
            });
            if (!bodyRes.ok) fail(`GET /install.sh returned HTTP ${bodyRes.status}`);
            const actual = (await bodyRes.arrayBuffer()).byteLength;
            if (!Number.isFinite(declared) || declared <= 0) {
              fail(`HEAD /install.sh reported content-length "${headRes.headers.get("content-length")}"; the source promises HEAD carries a real length`);
            }
            if (declared !== actual) {
              fail(`HEAD /install.sh declares ${declared} bytes but GET returns ${actual}`);
            }
            console.log(`  HEAD content-length ${declared} matches the body`);
          }

          // Every advertised digest must agree, not only install.sh: a partial
          // deploy could update one artifact and not another.
          for (const [name, meta] of Object.entries(local.artifacts)) {
            const liveMeta = live.artifacts && live.artifacts[name];
            if (meta.sha256 && (!liveMeta || liveMeta.sha256 !== meta.sha256)) {
              fail(`digest for ${name} differs: live ${liveMeta && liveMeta.sha256} vs main ${meta.sha256}`);
            }
          }

          // The manifest is a claim. This is the part that checks the claim, and
          // it does so for every published route — checking only install.sh
          // would miss a partial deploy in which the installer is correct but
          // hooks.sh or install.ps1 is stale, and those are executed too.
          let verified = 0;
          for (const [route, meta] of Object.entries(local.artifacts)) {
            if (!meta.sha256) continue;
            // Same reasoning as the poll loop: an untimed fetch here would hang
            // the job past any deadline the loop above enforced.
            const res = await fetch(`${ORIGIN}/${route}`, {
              cache: "no-store",
              signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS),
            });
            if (!res.ok) fail(`${route} returned HTTP ${res.status}`);
            const bytes = new Uint8Array(await res.arrayBuffer());
            const got = await sha256(bytes);
            const header = res.headers.get("x-resq-sha256");

            if (got !== meta.sha256) fail(`${route}: served bytes hash to ${got}, expected ${meta.sha256}`);
            if (header !== meta.sha256) fail(`${route}: x-resq-sha256 is ${header}, expected ${meta.sha256}`);
            if (bytes.byteLength === 0) fail(`${route}: served an empty body`);
            verified++;
            console.log(`  ${route.padEnd(14)} ${got.slice(0, 12)} ok`);
          }

          if (verified === 0) fail("no artifacts were verified — the manifest advertised none");

          // Sanity-check the shape of the thing people actually pipe to a shell,
          // so a 200 carrying an HTML error page cannot pass as an installer.
          const shRes = await fetch(`${ORIGIN}/`, { cache: "no-store", signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS) });
          const shBody = new Uint8Array(await shRes.arrayBuffer());
          if (!new TextDecoder().decode(shBody.slice(0, 9)).startsWith("#!/bin/sh")) {
            fail("the root route does not serve something that looks like the installer");
          }
          if (await sha256(shBody) !== want) fail("the root route and /install.sh disagree");

          console.log(`ok - ${ORIGIN} serves v${live.version} @ ${live.commit.slice(0, 8)}, ${verified} artifacts verified`);
          JS
