# ── Area labels (top-level source surfaces) ─────────────────────────────
# This repo is a shell-installer distribution, not a monorepo, so areas are
# keyed to the real top-level source dirs (bin, scripts, tests, worker) plus
# the top-level installer entrypoints.

"area:worker":
  - changed-files:
    - any-glob-to-any-file: worker/**/*

"area:bin":
  - changed-files:
    - any-glob-to-any-file: bin/**/*

"area:scripts":
  - changed-files:
    - any-glob-to-any-file: scripts/**/*

"area:tests":
  - changed-files:
    - any-glob-to-any-file: tests/**/*

"area:installers":
  - changed-files:
    - any-glob-to-any-file:
      - install.sh
      - install.ps1

"area:nix":
  - changed-files:
    - any-glob-to-any-file:
      - flake.nix
      - flake.lock

# ── DevOps / infra ──────────────────────────────────────────────────────

"A-DevOps":
  - changed-files:
    - any-glob-to-any-file:
      - .github/**/*

# ── Release plumbing ────────────────────────────────────────────────────

"A-Release":
  - changed-files:
    - any-glob-to-any-file:
      - VERSION
      - bin/gen-pins.sh
      - bin/stamp.sh
      - .github/workflows/release.yml

# ── Category labels ─────────────────────────────────────────────────────

"C-Documentation":
  - changed-files:
    - any-glob-to-any-file:
      - "**/*.md"
      - docs/**/*